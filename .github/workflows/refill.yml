name: Auto Refill Problems

on:
  schedule:
    # 毎月1日、11日、21日 00:00 UTC に自動実行
    - cron: '0 0 1,11,21 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refill problems into queue
        run: |
          # 候補単語から次の10日分をqueue/へ生成
          python3 scripts/release_today.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add queue/ data/
            git commit -m "Auto refill problems into queue [$(date +'%Y-%m-%d')]"
            git push
          else
            echo "No changes."
          fi
